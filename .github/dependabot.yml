# Propone actualizaciones de dependencias cada semana, agrupadas para no llenar de PR (ADR-0006).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # Los tipos de Node siguen la versión que corre el proyecto (Node 24 en el Dockerfile y
      # el CI). Al pasar a otra versión se cambia todo junto y se quita esta regla.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
