# CI: en cada push a main y en cada pull request, GitHub instala el proyecto en una
# máquina limpia y corre los mismos controles que en local (ADR-0006).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python sale de .python-version; --locked falla si uv.lock no coincide con pyproject.toml.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Estilo (ruff)
        run: uv run ruff check .

      - name: Pruebas (pytest)
        run: uv run pytest

      # Si cambia la API, el contrato de la web debe regenerarse en el mismo PR.
      - name: Contrato de la API al día
        run: |
          uv run tempo-ledger openapi --out /tmp/openapi.json
          diff -q /tmp/openapi.json frontend/openapi.json

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Estilo (oxlint)
        run: npm run lint
      - name: Tipos y compilación (tsc + vite)
        run: npm run build
