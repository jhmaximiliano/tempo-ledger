# CI: en cada push a main y en cada pull request, GitHub instala el proyecto en una
# máquina limpia y corre los mismos controles que en local (ADR-0006).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python sale de .python-version; --locked falla si uv.lock no coincide con pyproject.toml.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Estilo (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy)
        run: uv run mypy

      # El mínimo de cobertura está en pyproject.toml ([tool.coverage.report] fail_under).
      - name: Pruebas y cobertura (pytest)
        run: uv run pytest --cov --cov-report=term

      # Si cambia la API, el contrato de la web debe regenerarse en el mismo PR.
      - name: Contrato de la API al día
        run: |
          uv run tempo-ledger openapi --out /tmp/openapi.json
          diff -q /tmp/openapi.json frontend/openapi.json

  postgres:
    name: Base y API en PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tempo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Cada prueba crea su propio esquema en esta base (tests/dbutil.py).
      TEMPO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tempo
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias (con el extra de PostgreSQL)
        run: uv sync --locked --extra postgres

      - name: Pruebas que usan la base
        run: >-
          uv run pytest tests/test_calendar_db.py tests/test_pipeline.py tests/test_cli.py
          tests/test_api.py tests/test_api_extras.py

  docker:
    name: Docker Compose (todo junto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --wait espera a que PostgreSQL, la API y la web pasen sus chequeos de salud.
      - name: Construir y levantar
        run: docker compose up --build -d --wait

      - name: La web responde y lee de PostgreSQL a través de la API
        run: |
          curl -fsS http://localhost:8080/ | grep -q "tempo-ledger"
          curl -fsS http://localhost:8080/cierres/2026-03 | grep -q "tempo-ledger"
          curl -fsS http://localhost:8080/api/closings/2026-03 | grep -q '"period":"2026-03"'
          curl -fsS -o /dev/null http://localhost:8080/api/closings/2026-03/export.xlsx

      - name: Registros si algo falla
        if: failure()
        run: docker compose logs

      - name: Bajar
        if: always()
        run: docker compose down -v

  web:
    name: Web (lint + pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Estilo (oxlint)
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: Tipos y compilación (tsc + vite)
        run: npm run build
