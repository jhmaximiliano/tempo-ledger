[project]
name = "tempo-ledger"
version = "0.5.0"
description = "Banco de horas como libro contable: cada evento es un asiento y el saldo de cualquier cierre se reconstruye sumándolos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
tempo-ledger = "tempo_ledger.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # lo usa el TestClient de FastAPI
    "ruff>=0.6",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["tempo_ledger"]

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic: se revisan, pero no se reformatean a mano.
"src/tempo_ledger/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["tempo_ledger"]
mypy_path = "src"
strict = true
# Los Protocol con @property y las dataclasses congeladas ya dan la mayor parte del valor;
# no se exige anotar los cuerpos de las pruebas.
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
