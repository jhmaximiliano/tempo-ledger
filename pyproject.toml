[project]
name = "tempo-ledger"
version = "0.4.0"
description = "Banco de horas como libro contable: cada evento es un asiento y el saldo de cualquier cierre se reconstruye sumándolos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
tempo-ledger = "tempo_ledger.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # lo usa el TestClient de FastAPI
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic: se revisan, pero no se reformatean a mano.
"src/tempo_ledger/migrations/versions/*" = ["E501"]
