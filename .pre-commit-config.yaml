# Controles que corren antes de cada commit (ADR-0006). Instalar una vez:
#   uv run pre-commit install
# Ruff y mypy se ejecutan con las versiones fijadas en uv.lock, las mismas que usa el CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=600]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (estilo)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (tipos)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: oxlint
        name: oxlint (web)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/
        pass_filenames: false
