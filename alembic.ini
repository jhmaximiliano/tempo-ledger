# Configuración de Alembic para usarlo desde la terminal:
#   uv run alembic upgrade head
# La URL de la base sale de TEMPO_DATABASE_URL (por defecto, sqlite:///tempo.db).
[alembic]
script_location = src/tempo_ledger/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
