server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/closings/2026-03 -> http://api:8000/closings/2026-03 (igual que el proxy de Vite).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La web maneja sus rutas (/cierres/..., /empleados/...): todo lo demás es index.html.
    location / {
        try_files $uri /index.html;
    }
}
